name: gate-red-runs-nightly

# The slow half of the gate red runs (task 118): the smokes that drive Godot and Gradle (tool_smoke,
# runtime_smoke, both hot-reload smokes, the scene-check and JDK-lookup self-tests, the bootstrap and
# Gradle-template gates), each shown red on a known-bad input and green again, in a throwaway worktree.
# The fast set runs on every PR that touches scripts/ or the workflows (ci.yml, `gate-red-runs`).
on:
  schedule:
    # 03:40 UTC daily; off the hour to avoid the scheduler's peak queue.
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: read  # audit_stale_blockers.py resolves issue:<n> markers

concurrency:
  group: gate-red-runs-nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dash form of kanamaGodotVersion in gradle.properties (the single-source pin).
  GODOT_VERSION: 4.7.2-stable

jobs:
  slow:
    # Sharded like ci.yml's fast set: the whole --slow set outgrew one 90-minute job (cancelled 2026-10-18..20).
    name: gate red runs (--slow) (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history for generate_gates_index.py's date cases (see ci.yml gate-red-runs).
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Cache Godot binary and the Web and Android export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-web-android-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot and the Web and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/godot"
          godot_zip="$(mktemp)"
          curl -fL -o "$godot_zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "$godot_zip" -d "$HOME/godot"
          rm -f "$godot_zip"
          tpz="$(mktemp)"
          curl -fL -o "$tpz" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -j "$tpz" "templates/web_nothreads_release.zip" "templates/android_debug.apk" -d "$HOME/godot"
          rm -f "$tpz"

      # Must run even on a cache hit: the scene-check self-test exports a fixture for Web headless, and
      # export_guard_selftest.sh runs real headless Android exports (APK, and Gradle with Min SDK 26), which
      # need the Android template plus what a user sets once in Godot: the runner image's Android SDK, a Java
      # SDK and a debug keystore (as package.yml's android-export job). Without them that self-test skips its
      # Android rows and gate_red_runs.py reports the Min SDK case SKIPPED, which --strict fails.
      - name: Install the export templates and Godot's Android settings
        shell: bash
        run: |
          godot_dot="${GODOT_VERSION/-/.}"
          template_dir="$HOME/.local/share/godot/export_templates/$godot_dot"
          mkdir -p "$template_dir" "$HOME/.config/godot"
          cp "$HOME/godot/web_nothreads_release.zip" "$HOME/godot/android_debug.apk" "$template_dir/"
          [[ -x "$ANDROID_HOME/platform-tools/adb" ]] || { echo "no Android SDK at ANDROID_HOME=$ANDROID_HOME" >&2; exit 1; }
          keystore="$HOME/.config/godot/debug.keystore"
          rm -f "$keystore"
          "$JAVA_HOME/bin/keytool" -genkeypair -noprompt -keystore "$keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          settings="$HOME/.config/godot/editor_settings-$(echo "$godot_dot" | cut -d. -f1-2).tres"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
            echo "export/android/debug_keystore = \"$keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } >"$settings"
          cat "$settings"

      - name: Run every gate red run, slow ones included
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          godot_bin="$HOME/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          chmod +x "$godot_bin"
          # sync_kdoc needs a Godot docs checkout and the iOS kit smokes a Mac with Xcode, which this runner does not
          # have: skipped by name.
          KANAMA_GODOT_BIN="$godot_bin" python3 scripts/gate_red_runs.py --slow --strict --allow-skip "sync_kdoc,smoke.sh --ios" --shard ${{ matrix.shard }}/4
