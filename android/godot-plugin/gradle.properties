org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.daemon.jvmargs=-Xmx4g
# The kotlinx-coroutines an exported APK runs on: Godot's Android build template resolves it (4.7.2:
# kotlinx-coroutines-android 1.6.4 on standardDebugRuntimeClasspath), not Kanama. The runtime and scripts AARs
# compile against this version so an API newer than the APK's fails the build, not the device. Move it with the
# template (docs/contributing/godot-upgrade.md).
kanamaAndroidCoroutinesVersion=1.6.4
