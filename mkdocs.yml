site_name: Kanama
site_description: Kotlin GDExtension for Godot via Project Panama (FFM)
site_url: https://falcon4ever.github.io/kanama/
repo_name: falcon4ever/kanama
repo_url: https://github.com/falcon4ever/kanama
theme:
  name: material
  logo: assets/kanama-logo.png
  favicon: assets/kanama-logo.png
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
nav:
  - Home: index.md
  - Use Kanama:
      - Get Started: getting-started/index.md
      - Install Options:
          - Release Kit (New Project): getting-started/release-kit.md
          - Store Addon (Existing Project): getting-started/store-addon.md
          - Source Checkout: getting-started/source-checkout.md
      - Open in IntelliJ IDEA: getting-started/intellij.md
      - Edit, Build, Run: getting-started/editor-workflow.md
      - Writing Scripts: game-dev/scripts.md
      - Calling Godot APIs: game-dev/godot-api.md
      - Exports and Resources: game-dev/properties-resources.md
      - Signals and Await: game-dev/signals.md
      - Multiplayer: game-dev/multiplayer.md
      - Porting from GDScript: game-dev/porting-gdscript.md
      - Kotlin Style: game-dev/style-guide.md
      - Shipping Your Game:
          - Desktop: exporting/desktop.md
          - Android: exporting/android.md
          - iOS: exporting/ios.md
          - Web (Experimental): exporting/web.md
      - Upgrading from 0.4: getting-started/upgrading-0.4-to-0.5.md
      - Reference:
          - Requirements and Platform Status: reference/version-support.md
          - API Conventions: reference/wrapper-conventions.md
          - Coming from C#: reference/c-sharp-compat.md
          - API Coverage: reference/generated/api-coverage.md
          - Enum Constant Migration: reference/generated/enum-migration.md
  - Develop Kanama:
      - Start Here: contributing/index.md
      - Work on Kanama: getting-started/work-on-kanama.md
      - Architecture: contributing/architecture.md
      - Wrapper Generator: contributing/wrapper-maintenance.md
      - Shared Wrapper Tree Design Check: contributing/shared-wrapper-tree-design-check.md
      - Hot Reload Internals: contributing/hot-reload-internals.md
      - Godot Upgrade Runbook: contributing/godot-upgrade.md
      - Demo Porting Rules: contributing/demo-porting-rules.md
      - Writing These Docs: contributing/docs-style.md
      - Backends:
          - Android: contributing/backends/android.md
          - iOS: contributing/backends/ios.md
          - Web: contributing/backends/web.md
      - Generated Reports:
          - Wrapper Generator Report: reference/generated/wrapper-generator-report.md
          - Gates Index: reference/generated/gates.md
          - iOS Hand-written Registry: reference/generated/ios-backend-handwritten.md
          - iOS Shape Gap: reference/generated/ios-shape-gap.md
          - API Exercise: reference/generated/api-exercise.md
          - Web API Exercise: reference/generated/web-api-exercise.md
